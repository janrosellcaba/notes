<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09090B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var theme = localStorage.getItem("notes.theme") === "light" ? "light" : "dark";
        var logo = localStorage.getItem("notes.logo");
        if (theme === "light") {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#fafafa");
        }
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) {
          if (logo === "doodle") {
            icon.href = "/brand/logo1.jpg?v=doodle";
            icon.type = "image/jpeg";
          } else if (logo === "smile") {
            icon.href = "/brand/logo2.jpg?v=smile";
            icon.type = "image/jpeg";
          } else if (logo === "threeD") {
            icon.href = "/brand/logo3.png?v=threeD";
            icon.type = "image/png";
          } else if (theme === "light") {
            icon.href = "/favicon-light.svg";
            icon.type = "image/svg+xml";
          }
        }
      } catch (e) {}
    </script>
    <title>Notes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
